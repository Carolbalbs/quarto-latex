name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Renderizar site e os dois PDFs
        run: quarto render

      - name: Publicar PDFs como artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: docs/artigo/*.pdf
          if-no-files-found: error

      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Anexar PDFs à release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: docs/artigo/*.pdf

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
